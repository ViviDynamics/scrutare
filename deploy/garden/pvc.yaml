apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    # Review history, queue state and retained artifacts. ceph-rbd reclaims with
    # Retain, and Argo must not prune the claim either.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: scrutare-state
  namespace: scrutare
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 10Gi
