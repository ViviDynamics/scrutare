[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrutare"
dynamic = ["version"]
description = "A standalone code review meta harness"
requires-python = ">=3.10"
dependencies = [
    "pyjwt[crypto]>=2.10,<3",
    "pyyaml>=6.0",
]

[project.scripts]
scrutare = "scrutare.interfaces.cli:main"
scrutare-app = "scrutare.interfaces.app_server:main"
scrutare-mcp = "scrutare.interfaces.mcp:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-pyyaml>=6.0",
]

[tool.hatch.version]
path = "src/scrutare/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scrutare"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Evaluation fixtures that must carry a real Ruff diagnostic for the captured tool
# evidence comparison. tests/test_development_v3_corpus.py pins this list to the labels.
"evaluations/development-v3/sources/dev3-01/head/src/reporting/formatters.py" = ["F811"]
"evaluations/development-v3/sources/dev3-02/head/src/client/http_settings.py" = ["F821"]
"evaluations/development-v3/sources/dev3-03/base/src/plugins/api.py" = ["F401"]
"evaluations/development-v3/sources/dev3-03/head/src/plugins/api.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
