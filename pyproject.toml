[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrutare"
dynamic = ["version"]
description = "A standalone code review meta harness"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
scrutare = "scrutare.interfaces.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-pyyaml>=6.0",
]

[tool.hatch.version]
path = "src/scrutare/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scrutare"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
