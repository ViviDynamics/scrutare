# Focused identity and delivery acceptance, intentionally not whole-PR coverage.
strategy: panel
personas: [senior-dev]
budgets:
  per_persona_tokens: 10000
  review_max_tokens: 10000
models:
  default:
    provider: openai
    base_url: https://llm.vividynamics.com/v1
    model: spark/glm-5.3-flash
github:
  post_mode: comment
  paths:
    include: [tests/fixtures/action-acceptance/target.py]
    exclude: []
