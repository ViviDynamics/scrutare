name: Disclosure guard

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  disclosure-guard:
    name: disclosure guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A diff GitHub refuses as too large is rebuilt from git history.
          fetch-depth: 0
      - name: Block infrastructure detail from reaching this public repository
        env:
          GH_TOKEN: ${{ github.token }}
          VIVI_DISCLOSURE_TERMS: ${{ secrets.VIVI_DISCLOSURE_TERMS }}
        run: |
          cp repo.env.example repo.env
          .github/disclosure/disclosure-guard --pr ${{ github.event.pull_request.number }}
