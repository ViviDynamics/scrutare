name: Disclosure guard

on:
  pull_request:
  # The nare bump workflow starts the guard for its pull request: a pull request opened
  # with GITHUB_TOKEN starts no pull_request run.
  workflow_dispatch:
    inputs:
      pr:
        description: pull request number to check
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  disclosure-guard:
    name: disclosure guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A diff GitHub refuses as too large is rebuilt from git history.
          fetch-depth: 0
      - name: Block infrastructure detail from reaching this public repository
        env:
          GH_TOKEN: ${{ github.token }}
          VIVI_DISCLOSURE_TERMS: ${{ secrets.VIVI_DISCLOSURE_TERMS }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          [[ "$PR" =~ ^[1-9][0-9]*$ ]]
          cp repo.env.example repo.env
          .github/disclosure/disclosure-guard --pr "$PR"
