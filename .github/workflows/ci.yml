name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked development environment
        run: uv sync --locked --extra dev
      - name: Install pinned external nare runtime
        shell: bash
        run: |
          set -euo pipefail
          nare_checkout="$RUNNER_TEMP/scrutare-nare-2026.10.12"
          git clone --depth 1 --branch 2026.10.12 https://github.com/ViviDynamics/nare.git "$nare_checkout"
          test "$(git -C "$nare_checkout" rev-parse HEAD)" = "96672e1e6d23920fc6cdeebfcad7250c8c36cc5e"
          uv python install 3.14
          uv sync --project "$nare_checkout" --python 3.14 --locked --no-dev
          test -x "$nare_checkout/.venv/bin/nare"
          echo "SCRUTARE_TEST_NARE_EXECUTABLE=$nare_checkout/.venv/bin/nare" >> "$GITHUB_ENV"
      - name: Tests
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SCRUTARE_TEST_NARE_EXECUTABLE"
          test -x "$SCRUTARE_TEST_NARE_EXECUTABLE"
          uv run --locked --extra dev pytest
      - name: Lint
        run: uv run --locked --extra dev ruff check .
      - name: Strict typecheck
        run: uv run --locked --extra dev mypy src scripts/check-release.py scripts/auto-release.py
      - name: Build wheel
        run: uv build --wheel
      - name: Installed CLI smoke check
        shell: bash
        run: scripts/smoke-cli.sh
